version: '3.8'

services:
  rails:
    image: ghcr.io/rogerhounfourt/chatwoot:conecta-customizations
    pull_policy: always
    container_name: chatwoot-rails
    volumes:
      - storage:/app/storage
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    environment:
      # Node/Rails
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
      
      # Locale
      - DEFAULT_LOCALE=pt_BR
      
      # URLs
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - INTERNAL_HOST_URL=http://rails:3000
      
      # Database
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}
      
      # Security
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FORCE_SSL=${FORCE_SSL:-true}
      
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Branding ConectAi Automações
      - INSTALLATION_NAME=${INSTALLATION_NAME:-ConectAi Automações}
      - BRAND_NAME=${BRAND_NAME:-ConectAi}
      - BRAND_URL=${BRAND_URL:-https://conectai.com.br}
      - WIDGET_BRAND_URL=${WIDGET_BRAND_URL:-https://conectai.com.br}
      - LOGO_THUMBNAIL=${LOGO_THUMBNAIL:-/brand-assets/logo_thumbnail.svg}
      - LOGO=${LOGO:-/brand-assets/logo.svg}
      - LOGO_DARK=${LOGO_DARK:-/brand-assets/logo_dark.svg}
      - TERMS_URL=${TERMS_URL:-https://conectai.com.br/termos}
      - PRIVACY_URL=${PRIVACY_URL:-https://conectai.com.br/privacidade}
      - DISPLAY_MANIFEST=${DISPLAY_MANIFEST:-false}
      
      # Email/SMTP
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-noreply@conectai.com.br}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
      - SMTP_DOMAIN=${SMTP_DOMAIN}
      
      # Storage (local por padrão)
      - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
      
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  sidekiq:
    image: ghcr.io/rogerhounfourt/chatwoot:conecta-customizations
    pull_policy: always
    container_name: chatwoot-sidekiq
    volumes:
      - storage:/app/storage
    depends_on:
      - postgres
      - redis
    environment:
      # Node/Rails
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - RAILS_LOG_TO_STDOUT=true
      
      # Locale
      - DEFAULT_LOCALE=pt_BR
      
      # URLs
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - INTERNAL_HOST_URL=http://rails:3000
      
      # Database
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}
      
      # Security
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Branding
      - INSTALLATION_NAME=${INSTALLATION_NAME:-ConectAi Automações}
      - BRAND_NAME=${BRAND_NAME:-ConectAi}
      
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'ps aux | grep [s]idekiq']
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatwoot-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot_production}
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chatwoot-redis
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  storage:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: chatwoot-network
